name: main_action
on: [push, pull_request]
jobs:
  test:
    uses: ./.github/workflows/test.yml
  build_website:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - run: npm --version
      - run: node --version
      - run: npm install -g @angular/cli
      - run: |
          cd ./ESP_Angular_Frontend
          npm install
          ng build
      - uses: actions/upload-artifact@v4
        with:
          name: data
          path: ./ESP_Angular_Frontend/dist/my-app/browser
  build_eep_esp32:
    needs: [test]
    uses: ./.github/workflows/build_eep.yml
    with:
      core: esp32
      board: d1_mini32

