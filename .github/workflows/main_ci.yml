name: main_action
on: [push, pull_request]
jobs:
  test:
    uses: ./.github/workflows/test.yml
  build_website:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - run: npm --version
      - run: node --version
      - run: npm install -g @angular/cli
      - run: |
          cd ./ESP_Angular_Frontend
          npm install
          ng build
      - uses: actions/upload-artifact@v4
        with:
          name: data
          path: ./ESP_Angular_Frontend/dist/my-app/browser
  build_eep_esp32:
    needs: [test, build_website]
    uses: ./.github/workflows/build_eep.yml
    with:
      core: esp32
      board: d1_mini32
      # 3.2.0 RC1 does not work currently:
      # ERROR: could not find /home/runner/.arduino15/packages/esp32/hardware/esp32/3.2.0/tools/partitions/boot_app0.bin
      core-version: 3.1.3
  build_eep_esp8266:
    needs: [test, build_website]
    uses: ./.github/workflows/build_eep.yml
    with:
      core: esp8266
      board: d1_mini
  build_EEF_packages:
    runs-on: ubuntu-latest
    needs: [build_eep_esp32, build_eep_esp8266]
    env:
        TARGET: win64
    steps:
      - uses: hredan/eef-carefree-action@init
        with:
          target-os: ${{env.TARGET}}
